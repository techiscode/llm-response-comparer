[project]
name = "llm-response-comparer"
version = "1.0.0"
description = "Send one prompt to several LLMs, then score the answers blind against a rubric."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Senthil Kumar Natarajan" }]
dependencies = ["requests>=2.31", "python-dotenv>=1.0"]

[project.scripts]
llm-compare = "llm_compare.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
